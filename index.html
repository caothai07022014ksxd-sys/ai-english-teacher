<script>

/* =====================================================
   1. APPS SCRIPT
===================================================== */

const APPS_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycbybyMT34Odqd6jnDwHpqck_aizGYEWQjCo1jpuxD4Wc3LY_Hc-G3WHrQvUgkkYn4o_OZg/exec';


/* =====================================================
   2. SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


/* =====================================================
   3. STATE
===================================================== */

let recognition = null;

let microphoneStream = null;

let isListening = false;

let isProcessing = false;

let conversationActive = false;

let startingRecognition = false;

let stopRequested = false;

let restartTimer = null;

let recognitionGeneration = 0;


/* =====================================================
   4. HISTORY
===================================================== */

let conversationHistory = [];


/* =====================================================
   5. TEACHER
===================================================== */

let lastTeacherText = '';

let lastCorrectSentence = '';


/* =====================================================
   6. SCORE
===================================================== */

let totalScore = 0;

let totalQuestions = 0;


/* =====================================================
   7. VOICE
===================================================== */

let availableVoices = [];

let englishVoices = [];

let selectedVoice = null;

let selectedVoiceIndex = -1;

let voiceSpeed = 0.85;


/* =====================================================
   8. PAGE LOAD
===================================================== */

window.addEventListener(
  'load',
  function () {

    loadLesson();

    loadVoices();

    changeSpeed();

    setTimeout(
      loadVoices,
      300
    );

    setTimeout(
      loadVoices,
      1000
    );

  }
);


/* =====================================================
   9. VOICES CHANGED
===================================================== */

if (window.speechSynthesis) {

  window.speechSynthesis.addEventListener(
    'voiceschanged',
    loadVoices
  );

}


/* =====================================================
   10. LOAD LESSON
===================================================== */

function loadLesson() {

  clearError();

  clearSuccess();

  callApi(
    'lesson',
    {}
  );

}


/* =====================================================
   11. LOAD VOICES
===================================================== */

function loadVoices() {

  if (!window.speechSynthesis) {

    return;

  }


  availableVoices =
    window.speechSynthesis.getVoices();


  if (!availableVoices.length) {

    return;

  }


  englishVoices =
    availableVoices.filter(
      function (voice) {

        return (
          voice.lang &&
          voice.lang
            .toLowerCase()
            .startsWith('en')
        );

      }
    );


  const voicesToShow =
    englishVoices.length
      ? englishVoices
      : availableVoices;


  const select =
    document.getElementById(
      'voiceSelect'
    );


  if (!select) {

    return;

  }


  const previousValue =
    select.value;


  select.innerHTML = '';


  voicesToShow.forEach(
    function (
      voice,
      index
    ) {

      const option =
        document.createElement(
          'option'
        );


      option.value =
        String(index);


      let label =
        voice.name;


      if (voice.lang) {

        label +=
          ' (' +
          voice.lang +
          ')';

      }


      if (voice.default) {

        label +=
          ' ⭐';

      }


      option.textContent =
        label;


      select.appendChild(
        option
      );

    }
  );


  let defaultIndex = -1;


  /*
   * Ưu tiên:
   *
   * 1. Voice đang chọn
   * 2. English US
   * 3. Google
   * 4. Samantha
   * 5. Voice mặc định
   * 6. Voice đầu tiên
   */


  if (
    selectedVoice &&
    selectedVoice.name
  ) {

    defaultIndex =
      voicesToShow.findIndex(
        function (voice) {

          return (
            voice.name ===
            selectedVoice.name
          );

        }
      );

  }


  if (defaultIndex === -1) {

    defaultIndex =
      voicesToShow.findIndex(
        function (voice) {

          return (
            voice.lang &&
            voice.lang
              .toLowerCase() ===
            'en-us'
          );

        }
      );

  }


  if (defaultIndex === -1) {

    defaultIndex =
      voicesToShow.findIndex(
        function (voice) {

          return voice.name
            .toLowerCase()
            .includes('google');

        }
      );

  }


  if (defaultIndex === -1) {

    defaultIndex =
      voicesToShow.findIndex(
        function (voice) {

          return voice.name
            .toLowerCase()
            .includes('samantha');

        }
      );

  }


  if (defaultIndex === -1) {

    defaultIndex =
      voicesToShow.findIndex(
        function (voice) {

          return voice.default;

        }
      );

  }


  if (defaultIndex === -1) {

    defaultIndex = 0;

  }


  /*
   * Nếu voice cũ vẫn còn tồn tại
   * thì giữ nguyên voice đó.
   */

  if (
    previousValue !== '' &&
    voicesToShow[
      Number(previousValue)
    ]
  ) {

    const oldVoice =
      voicesToShow[
        Number(previousValue)
      ];


    const sameVoice =
      selectedVoice &&
      oldVoice.name ===
      selectedVoice.name;


    if (sameVoice) {

      defaultIndex =
        Number(previousValue);

    }

  }


  select.value =
    String(defaultIndex);


  selectedVoiceIndex =
    defaultIndex;


  selectedVoice =
    voicesToShow[
      defaultIndex
    ];

}


/* =====================================================
   12. CHANGE VOICE
===================================================== */

function changeVoice() {

  const select =
    document.getElementById(
      'voiceSelect'
    );


  if (!select) {

    return;

  }


  const index =
    Number(
      select.value
    );


  const voicesToShow =
    englishVoices.length
      ? englishVoices
      : availableVoices;


  if (!voicesToShow[index]) {

    return;

  }


  selectedVoiceIndex =
    index;


  selectedVoice =
    voicesToShow[index];


  setVoiceStatus(
    '🎙️ Đã chọn: ' +
    selectedVoice.name
  );

}


/* =====================================================
   13. CHANGE SPEED
===================================================== */

function changeSpeed() {

  const slider =
    document.getElementById(
      'voiceSpeed'
    );


  const value =
    document.getElementById(
      'speedValue'
    );


  if (!slider) {

    return;

  }


  voiceSpeed =
    Number(
      slider.value
    );


  if (value) {

    value.innerText =
      voiceSpeed.toFixed(2);

  }

}


/* =====================================================
   14. TEST VOICE
===================================================== */

function testTeacherVoice() {

  clearError();


  const text =
    'Hello! I am your English teacher. Let us practice English together.';


  speakTeacher(
    text,
    false
  );

}


/* =====================================================
   15. ENVIRONMENT
===================================================== */

function checkEnvironment() {

  if (
    location.protocol !== 'https:' &&
    location.hostname !== 'localhost'
  ) {

    showError(
      'Website phải chạy bằng HTTPS.'
    );

    return false;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      'Trình duyệt không hỗ trợ microphone.'
    );

    return false;

  }


  if (!SpeechRecognition) {

    showError(
      'Trình duyệt không hỗ trợ Speech Recognition.'
    );

    return false;

  }


  return true;

}


/* =====================================================
   16. MICROPHONE
===================================================== */

async function requestMicrophonePermission() {

  if (!checkEnvironment()) {

    return false;

  }


  /*
   * Nếu microphone đã được cấp quyền
   * thì không xin lại.
   */

  if (microphoneStream) {

    return true;

  }


  try {

    microphoneStream =
      await navigator.mediaDevices.getUserMedia({

        audio: {

          echoCancellation: true,

          noiseSuppression: true,

          autoGainControl: true

        }

      });


    setVoiceStatus(
      '✅ Microphone đã được cấp quyền.'
    );


    return true;

  }

  catch (error) {

    console.error(
      'Microphone error:',
      error
    );


    let message =
      'Không thể truy cập microphone.';


    if (
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'Bạn chưa cho phép website sử dụng microphone.\n\n' +
        'Hãy bấm biểu tượng 🔒 trên thanh địa chỉ → Microphone → Allow.';

    }


    else if (
      error.name ===
      'NotFoundError'
    ) {

      message =
        'Không tìm thấy microphone trên thiết bị.';

    }


    else if (
      error.name ===
      'NotReadableError'
    ) {

      message =
        'Microphone đang được sử dụng bởi ứng dụng khác.';

    }


    showError(
      message +
      '\n\nMã lỗi: ' +
      (error.name || 'Unknown')
    );


    return false;

  }

}


/* =====================================================
   17. TOGGLE CONVERSATION
===================================================== */

async function toggleConversation() {

  if (isProcessing) {

    return;

  }


  clearError();


  /*
   * BẮT ĐẦU
   */

  if (!conversationActive) {

    stopRequested =
      false;


    const granted =
      await requestMicrophonePermission();


    if (!granted) {

      return;

    }


    conversationActive =
      true;


    setVoiceStatus(
      '🎤 Chuẩn bị microphone...'
    );


    startListening();


    return;

  }


  /*
   * Đang nghe → dừng lượt nghe
   */

  if (isListening) {

    stopListening();


    setVoiceStatus(
      '⏸️ Đã tạm dừng. Bấm NÓI để tiếp tục.'
    );


    return;

  }


  /*
   * Không nghe → bắt đầu lượt mới
   */

  startListening();

}


/* =====================================================
   18. START LISTENING
===================================================== */

function startListening() {

  if (
    !conversationActive ||
    isProcessing ||
    isListening ||
    startingRecognition
  ) {

    return;

  }


  if (!SpeechRecognition) {

    showError(
      'Speech Recognition không khả dụng.'
    );

    return;

  }


  if (restartTimer) {

    clearTimeout(
      restartTimer
    );

    restartTimer =
      null;

  }


  startingRecognition =
    true;


  stopRequested =
    false;


  clearError();


  /*
   * Mỗi phiên recognition có một ID riêng.
   * Giúp tránh callback của phiên cũ
   * làm ảnh hưởng phiên mới.
   */

  const currentGeneration =
    ++recognitionGeneration;


  recognition =
    new SpeechRecognition();


  recognition.lang =
    'en-US';


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    function () {

      if (
        currentGeneration !==
        recognitionGeneration
      ) {

        return;

      }


      startingRecognition =
        false;


      isListening =
        true;


      const button =
        document.getElementById(
          'micButton'
        );


      button.classList.add(
        'listening'
      );


      button.classList.remove(
        'processing'
      );


      button.classList.remove(
        'ready'
      );


      button.innerHTML =
        '🔴<br>ĐANG NGHE';


      setVoiceStatus(
        '🎤 Hãy nói tiếng Anh...'
      );

    };


  recognition.onresult =
    function (event) {

      if (
        currentGeneration !==
        recognitionGeneration
      ) {

        return;

      }


      if (
        !event ||
        !event.results ||
        !event.results.length
      ) {

        return;

      }


      const result =
        event.results[
          event.results.length - 1
        ];


      if (
        !result ||
        !result[0]
      ) {

        return;

      }


      const text =
        result[0]
          .transcript
          .trim();


      if (!text) {

        return;

      }


      /*
       * Chỉ xử lý đúng một lần.
       */

      if (isProcessing) {

        return;

      }


      addStudentMessage(
        text
      );


      sendToTeacher(
        text
      );

    };


  recognition.onerror =
    function (event) {

      if (
        currentGeneration !==
        recognitionGeneration
      ) {

        return;

      }


      startingRecognition =
        false;


      isListening =
        false;


      const errorCode =
        event &&
        event.error
          ? event.error
          : 'unknown';


      console.log(
        'Speech Recognition:',
        errorCode
      );


      /*
       * ABORTED
       *
       * Không coi đây là lỗi nghiêm trọng.
       */

      if (
        errorCode ===
        'aborted'
      ) {

        resetMicButton();


        if (
          conversationActive &&
          !stopRequested &&
          !isProcessing
        ) {

          setVoiceStatus(
            '🎤 Phiên nghe đã kết thúc. Bấm NÓI để tiếp tục.'
          );

        }


        return;

      }


      resetMicButton();


      let message =
        'Speech Recognition lỗi: ' +
        errorCode;


      if (
        errorCode ===
        'service-not-allowed'
      ) {

        message =
          'Trình duyệt không cho phép Speech Recognition.\n\n' +
          'Hãy thử Chrome trên máy tính hoặc Safari trên iPhone.';

      }


      else if (
        errorCode ===
        'not-allowed'
      ) {

        message =
          'Speech Recognition bị trình duyệt từ chối.\n\n' +
          'Hãy kiểm tra quyền Microphone của website.';

      }


      else if (
        errorCode ===
        'no-speech'
      ) {

        message =
          'Không nghe thấy giọng nói.\n\n' +
          'Hãy nói rõ và gần microphone hơn.';

      }


      else if (
        errorCode ===
        'audio-capture'
      ) {

        message =
          'Không lấy được tín hiệu microphone.';

      }


      else if (
        errorCode ===
        'network'
      ) {

        message =
          'Speech Recognition gặp lỗi mạng.';

      }


      showError(
        message
      );

    };


  recognition.onend =
    function () {

      if (
        currentGeneration !==
        recognitionGeneration
      ) {

        return;

      }


      startingRecognition =
        false;


      isListening =
        false;


      resetMicButton();


      /*
       * Nếu vừa gửi câu cho AI
       * thì không báo "đến lượt bạn".
       */

      if (
        conversationActive &&
        !stopRequested &&
        !isProcessing
      ) {

        setVoiceStatus(
          '🎤 Đã nghe xong. Bấm NÓI để nói tiếp.'
        );

      }

    };


  try {

    recognition.start();

  }

  catch (error) {

    startingRecognition =
      false;


    isListening =
      false;


    console.error(
      'recognition.start():',
      error
    );


    resetMicButton();


    /*
     * Nếu trình duyệt báo recognition
     * đang chạy thì không hiện lỗi đỏ.
     */

    if (
      error.name !==
      'InvalidStateError'
    ) {

      showError(
        'Không thể bắt đầu nhận diện giọng nói.'
      );

    }

  }

}


/* =====================================================
   19. STOP LISTENING
===================================================== */

function stopListening() {

  stopRequested =
    true;


  recognitionGeneration++;


  if (restartTimer) {

    clearTimeout(
      restartTimer
    );

    restartTimer =
      null;

  }


  if (recognition) {

    try {

      recognition.abort();

    }

    catch (error) {

      console.log(
        'recognition.abort():',
        error
      );

    }

  }


  recognition =
    null;


  isListening =
    false;


  startingRecognition =
    false;


  resetMicButton();

}


/* =====================================================
   20. RELEASE MICROPHONE
===================================================== */

function releaseMicrophone() {

  if (!microphoneStream) {

    return;

  }


  microphoneStream
    .getTracks()
    .forEach(
      function (track) {

        try {

          track.stop();

        }

        catch (error) {

          console.log(
            error
          );

        }

      }
    );


  microphoneStream =
    null;

}


/* =====================================================
   21. STOP CONVERSATION
===================================================== */

function stopConversation() {

  conversationActive =
    false;


  stopRequested =
    true;


  stopListening();


  releaseMicrophone();


  if (
    window.speechSynthesis
  ) {

    window.speechSynthesis.cancel();

  }


  const button =
    document.getElementById(
      'micButton'
    );


  button.classList.remove(
    'listening'
  );


  button.classList.remove(
    'processing'
  );


  button.classList.add(
    'ready'
  );


  button.innerHTML =
    '🎤<br>BẮT ĐẦU';


  setVoiceStatus(
    '⏹ Đã dừng cuộc hội thoại'
  );

}


/* =====================================================
   22. RESET MIC BUTTON
===================================================== */

function resetMicButton() {

  const button =
    document.getElementById(
      'micButton'
    );


  if (!button) {

    return;

  }


  if (isProcessing) {

    button.classList.remove(
      'listening'
    );


    button.classList.add(
      'processing'
    );


    button.innerHTML =
      '🤖<br>AI';


    return;

  }


  button.classList.remove(
    'listening'
  );


  button.classList.remove(
    'processing'
  );


  if (conversationActive) {

    button.classList.remove(
      'ready'
    );


    button.innerHTML =
      '🎤<br>NÓI';

  }

  else {

    button.classList.add(
      'ready'
    );


    button.innerHTML =
      '🎤<br>BẮT ĐẦU';

  }

}


/* =====================================================
   23. SEND TO TEACHER
===================================================== */

function sendToTeacher(
  message
) {

  if (!message) {

    return;

  }


  if (isProcessing) {

    return;

  }


  isProcessing =
    true;


  stopRequested =
    true;


  /*
   * Dừng recognition hiện tại.
   */

  if (recognition) {

    try {

      recognition.abort();

    }

    catch (error) {

      console.log(
        error
      );

    }

  }


  recognition =
    null;


  isListening =
    false;


  startingRecognition =
    false;


  resetMicButton();


  const button =
    document.getElementById(
      'micButton'
    );


  button.classList.add(
    'processing'
  );


  button.innerHTML =
    '🤖<br>AI';


  document.getElementById(
    'loading'
  ).style.display =
    'block';


  setVoiceStatus(
    '🤖 Giáo viên đang suy nghĩ...'
  );


  conversationHistory.push({

    role:
      'user',

    text:
      message

  });


  /*
   * Chỉ giữ 8 message gần nhất.
   */

  const history =
    conversationHistory.slice(-8);


  callApi(
    'chat',
    {

      message:
        message,

      history:
        history

    }
  );

}


/* =====================================================
   24. API
===================================================== */

function callApi(
  action,
  payload
) {

  const callbackName =
    'apiCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      1000000
    );


  let finished =
    false;


  const timeoutId =
    setTimeout(
      function () {

        if (finished) {

          return;

        }


        finished =
          true;


        delete window[
          callbackName
        ];


        document.getElementById(
          'loading'
        ).style.display =
          'none';


        isProcessing =
          false;


        resetMicButton();


        showError(
          'Apps Script không phản hồi sau 30 giây.'
        );

      },
      30000
    );


  window[callbackName] =
    function (response) {

      if (finished) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeoutId
      );


      try {

        handleActionResponse(
          action,
          response
        );

      }

      catch (error) {

        console.error(
          error
        );


        isProcessing =
          false;


        document.getElementById(
          'loading'
        ).style.display =
          'none';


        resetMicButton();


        showError(
          error.message ||
          'Lỗi không xác định.'
        );

      }


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  const params =
    new URLSearchParams();


  params.set(
    'api',
    '1'
  );


  params.set(
    'action',
    action
  );


  params.set(
    'callback',
    callbackName
  );


  if (payload) {

    params.set(
      'data',
      JSON.stringify(
        payload
      )
    );

  }


  const script =
    document.createElement(
      'script'
    );


  script.async =
    true;


  script.src =
    APPS_SCRIPT_URL +
    '?' +
    params.toString();


  script.onerror =
    function () {

      if (finished) {

        return;

      }


      finished =
        true;


      clearTimeout(
        timeoutId
      );


      delete window[
        callbackName
      ];


      document.getElementById(
        'loading'
      ).style.display =
        'none';


      isProcessing =
        false;


      resetMicButton();


      showError(
        'Không kết nối được Apps Script.'
      );

    };


  document.body.appendChild(
    script
  );

}


/* =====================================================
   25. HANDLE RESPONSE
===================================================== */

function handleActionResponse(
  action,
  response
) {

  if (!response) {

    throw new Error(
      'API không trả về dữ liệu.'
    );

  }


  if (!response.success) {

    document.getElementById(
      'loading'
    ).style.display =
      'none';


    isProcessing =
      false;


    resetMicButton();


    showError(
      response.error ||
      'API xảy ra lỗi.'
    );


    return;

  }


  if (
    action ===
    'lesson'
  ) {

    document.getElementById(
      'lessonTopic'
    ).innerText =
      response.data &&
      response.data.topic
        ? response.data.topic
        : 'Bài học hiện tại';


    return;

  }


  if (
    action ===
    'chat'
  ) {

    handleTeacherResponse(
      response.data
    );

  }

}


/* =====================================================
   26. TEACHER RESPONSE
===================================================== */

function handleTeacherResponse(
  data
) {

  isProcessing =
    false;


  stopRequested =
    false;


  document.getElementById(
    'loading'
  ).style.display =
    'none';


  if (!data) {

    resetMicButton();


    throw new Error(
      'Giáo viên không trả về dữ liệu.'
    );

  }


  const teacherText =
    String(
      data.reply ||
      data.next ||
      'Good!'
    ).trim();


  lastTeacherText =
    teacherText;


  lastCorrectSentence =
    data.correctSentence ||
    '';


  addTeacherMessage(
    teacherText
  );


  conversationHistory.push({

    role:
      'assistant',

    text:
      teacherText

  });


  showScore(
    data
  );


  document.getElementById(
    'correction'
  ).innerText =
    data.correction ||
    'Không có lỗi đáng kể.';


  document.getElementById(
    'correctSentence'
  ).innerText =
    data.correctSentence ||
    '';


  document.getElementById(
    'explanation'
  ).innerText =
    data.explanation ||
    '';


  document.getElementById(
    'comment'
  ).innerText =
    data.comment ||
    '';


  showSuccess(
    '✅ Giáo viên đã trả lời.'
  );


  /*
   * Cho giáo viên nói.
   * Sau khi nói xong → tự chuyển sang lượt người học.
   */

  speakTeacher(
    teacherText,
    true
  );

}

/* =====================================================
   29. SCORE
===================================================== */

function showScore(
  data
) {

  const scoreCard =
    document.getElementById(
      'scoreCard'
    );


  scoreCard.style.display =
    'block';


  const score =
    Number(
      data.score || 0
    );


  const safeScore =
    Math.max(
      0,
      Math.min(
        100,
        score
      )
    );


  document.getElementById(
    'mainScore'
  ).innerText =
    safeScore +
    '/100';


  document.getElementById(
    'progressBar'
  ).style.width =
    safeScore +
    '%';


  document.getElementById(
    'vocabulary'
  ).innerText =
    data.vocabulary ?? 0;


  document.getElementById(
    'grammar'
  ).innerText =
    data.grammar ?? 0;


  document.getElementById(
    'fluency'
  ).innerText =
    data.fluency ?? 0;


  document.getElementById(
    'pronunciation'
  ).innerText =
    data.pronunciation ?? 0;


  totalScore +=
    safeScore;


  totalQuestions++;

}


/* =====================================================
   30. TEXT TO SPEECH
===================================================== */

function speakTeacher(
  text,
  autoContinue
) {

  if (!text) {

    return;

  }


  if (!window.speechSynthesis) {

    showError(
      'Trình duyệt không hỗ trợ Text-to-Speech.'
    );

    return;

  }


  if (
    typeof autoContinue ===
    'undefined'
  ) {

    autoContinue =
      true;

  }


  /*
   * Hủy giọng đang đọc trước đó.
   */

  window.speechSynthesis.cancel();


  if (!availableVoices.length) {

    loadVoices();

  }


  const speech =
    new SpeechSynthesisUtterance(
      text
    );


  if (selectedVoice) {

    speech.voice =
      selectedVoice;


    speech.lang =
      selectedVoice.lang ||
      'en-US';

  }

  else {

    speech.lang =
      'en-US';

  }


  speech.rate =
    voiceSpeed;


  speech.pitch =
    1.0;


  speech.volume =
    1.0;


  speech.onstart =
    function () {

      setVoiceStatus(
        '🔊 Giáo viên đang nói...'
      );

    };


  speech.onend =
    function () {

      if (!autoContinue) {

        setVoiceStatus(
          '✅ Đã thử giọng.'
        );

        return;

      }


      if (
        conversationActive &&
        !stopRequested
      ) {

        setVoiceStatus(
          '🎤 Đến lượt bạn nói'
        );


        /*
         * Chờ một chút trước khi bật microphone.
         * Điều này giúp giảm lỗi aborted trên Safari.
         */

        restartTimer =
          setTimeout(
            function () {

              restartTimer =
                null;


              if (
                conversationActive &&
                !stopRequested &&
                !isProcessing &&
                !isListening &&
                !startingRecognition
              ) {

                startListening();

              }

            },
            1000
          );

      }

      else {

        setVoiceStatus(
          '⏸️ Cuộc hội thoại đã dừng.'
        );

      }

    };


  speech.onerror =
    function (event) {

      console.error(
        'TTS error:',
        event
      );


      if (
        conversationActive &&
        !stopRequested
      ) {

        setVoiceStatus(
          '⚠️ Không đọc được giọng. Bấm NÓI để tiếp tục.'
        );

      }

    };


  /*
   * Một số trình duyệt cần delay rất ngắn
   * trước khi gọi speak().
   */

  setTimeout(
    function () {

      try {

        window.speechSynthesis.speak(
          speech
        );

      }

      catch (error) {

        console.error(
          error
        );

        showError(
          'Không thể phát giọng giáo viên.'
        );

      }

    },
    50
  );

}

/* =====================================================
   32. STATUS
===================================================== */

function setVoiceStatus(
  text
) {

  const element =
    document.getElementById(
      'voiceStatus'
    );


  if (element) {

    element.innerText =
      text;

  }

}


/* =====================================================
   33. ERROR
===================================================== */

function showError(
  message
) {

  const error =
    document.getElementById(
      'error'
    );


  if (!error) {

    return;

  }


  error.style.display =
    'block';


  error.innerText =
    '❌ ' +
    message;

}


function clearError() {

  const error =
    document.getElementById(
      'error'
    );


  if (!error) {

    return;

  }


  error.style.display =
    'none';


  error.innerText =
    '';

}


/* =====================================================
   34. SUCCESS
===================================================== */

function showSuccess(
  message
) {

  const success =
    document.getElementById(
      'success'
    );


  if (!success) {

    return;

  }


  success.style.display =
    'block';


  success.innerText =
    message;


  setTimeout(
    function () {

      success.style.display =
        'none';

    },
    3000
  );

}


/* =====================================================
   35. SCROLL
===================================================== */

function scrollChat() {

  const chat =
    document.getElementById(
      'chat'
    );


  if (!chat) {

    return;

  }


  chat.scrollTop =
    chat.scrollHeight;

}


/* =====================================================
   36. ESCAPE HTML
===================================================== */

function escapeHtml(
  text
) {

  const div =
    document.createElement(
      'div'
    );


  div.innerText =
    String(text);


  return div.innerHTML;

}


/* =====================================================
   37. PAGE UNLOAD
===================================================== */

window.addEventListener(
  'beforeunload',
  function () {

    conversationActive =
      false;


    stopRequested =
      true;


    if (restartTimer) {

      clearTimeout(
        restartTimer
      );

    }


    if (recognition) {

      try {

        recognition.abort();

      }

      catch (error) {}

    }


    releaseMicrophone();


    if (
      window.speechSynthesis
    ) {

      window.speechSynthesis.cancel();

    }

  }
);

</script>
